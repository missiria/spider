# Spider — Nginx reverse proxy
# Next.js web on 127.0.0.1:8091, NestJS API on 127.0.0.1:8090.
# /api/* -> API, everything else -> Next.js.

upstream spider_api {
    server 127.0.0.1:8090;
    keepalive 32;
}

upstream spider_web {
    server 127.0.0.1:8091;
    keepalive 32;
}

# Cloudflare sits in front (proxied DNS): take the visitor IP from CF-Connecting-IP, but only
# when the peer is a Cloudflare address. Refresh the ranges from
# https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6 when they change.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Cloudflare connects to the origin over TLS (zone SSL mode Full): serve 443 with the Let's Encrypt
# cert (`certbot certonly --nginx -d spider.missiria.dev`, renewed by the certbot timer). Port 80
# stays open for ACME renewals and Flexible mode.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spider.missiria.dev;

    ssl_certificate     /etc/letsencrypt/live/spider.missiria.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spider.missiria.dev/privkey.pem;

    # API
    location /api/ {
        proxy_pass http://spider_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Spider-Client-Ip "";
        proxy_set_header X-Spider-Proxy-Secret "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js static assets
    location /_next/static/ {
        proxy_pass http://spider_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend
    location / {
        proxy_pass http://spider_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Spider-Client-Ip "";
        proxy_set_header X-Spider-Proxy-Secret "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
